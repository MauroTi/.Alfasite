name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir -p _site/scripts/modules _site/intranet
          cp frontend/index.html _site/index.html
          cp -R frontend/assets frontend/styles _site/
          cp frontend/scripts/main.js frontend/scripts/theme-toggle.js _site/scripts/
          cp frontend/scripts/modules/*.js _site/scripts/modules/
          cp pages/intranet.html _site/intranet/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
